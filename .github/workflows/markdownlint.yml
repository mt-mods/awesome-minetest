name: markdownlint

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: apt
      run: sudo apt-get install -y nodejs npm

    - name: npm install
      run: sudo npm i -g markdownlint-cli

    - name: markdown lint
      run: markdownlint .
